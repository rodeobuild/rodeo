<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Signed in · Rodeo</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #1d1d1d;
        color: rgba(255, 255, 255, 0.95);
        font: 14px/1.5 "Spline Sans", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 14px 0 6px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 6px;
        color: rgba(255, 255, 255, 0.6);
      }
      a {
        color: #5ea8ff;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f6f6f6;
          color: rgba(0, 0, 0, 0.88);
        }
        p {
          color: rgba(0, 0, 0, 0.55);
        }
        a {
          color: #1a7fe0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" width="44" height="44" />
      <h1>You're signed in</h1>
      <p>Close this window to go back to your drawing.</p>
      <p><a href="/">Or open Rodeo here</a></p>
    </main>
    <script>
      // The window a provider's sign-in opens in ends here (src/features/account/signin.ts) with
      // ?signed-in=1: it tells the Rodeo page that opened it, which keeps its drawing, then closes.
      // Reached any other way, it is not the end of a sign-in, so it goes to Rodeo (only from its own
      // address, so it can never send a page round in a circle).
      if (!/[?&]signed-in=1(&|$)/.test(location.search)) {
        if (/\/signed-in\.html$/.test(location.pathname)) location.replace("/");
      } else {
        try {
          new BroadcastChannel("rodeo-auth").postMessage("signed-in");
        } catch (e) {
          // no channels: the opener is told directly, below
        }
        try {
          if (window.opener) window.opener.postMessage("rodeo-signed-in", location.origin);
        } catch (e) {
          // no opener to tell: the page that opened this one looks again when the window closes
        }
        // a moment for the message to leave, then close (a window a script opened may close itself)
        setTimeout(function () {
          window.close();
        }, 200);
      }
    </script>
  </body>
</html>
