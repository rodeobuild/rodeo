[package]
name = "rodeo-desktop"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Rodeo desktop shell: the web editor in a native window"

[lib]
name = "rodeo_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "rodeo-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
tiny_http = { version = "0.12", optional = true }

# The Mac's own calls: the Dock's recent documents, and the "edited" dot in the close button.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }

[features]
default = []
testhook = ["dep:tiny_http"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
